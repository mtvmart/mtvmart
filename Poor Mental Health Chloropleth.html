<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>Poor Mental Health Days by US County (2023)</title>

    <link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/light/main.css" />
    <script src="https://js.arcgis.com/4.28/"></script>

    <style>
      html, body, #viewDiv {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }
    </style>

    <script>
      require(["esri/Map", "esri/views/MapView", "esri/layers/FeatureLayer", "esri/widgets/Legend"], (
        Map, MapView, FeatureLayer, Legend
      ) => {

        const renderer = {
          type: "simple",
          symbol: {
            type: "simple-fill",
            outline: { color: [200, 200, 200, 0.3], width: "0.5px" }
          },
          visualVariables: [
            {
              type: "color",
              field: "v002_rawvalue",
              legendOptions: { title: "% Days in Poor Mental Health" },
              stops: [
                { value: 0,  color: "#edf8e9", label: "0%" },
                { value: 10, color: "#bae4b3" },
                { value: 16, color: "#74c476", label: "16% (avg)" },
                { value: 24, color: "#31a354" },
                { value: 37, color: "#006d2c", label: "37% (high)" }
              ]
            }
          ]
        };

        const noDataRenderer = {
          type: "simple",
          symbol: {
            type: "simple-fill",
            color: [211, 211, 211, 0.8],
            outline: { color: [200, 200, 200, 0.3], width: "0.5px" }
          }
        };

        const noDataLayer = new FeatureLayer({
          url: "https://services.arcgis.com/V6ZHFr6zdgNZuVG0/ArcGIS/rest/services/County_Health_Rankings_2023_UC/FeatureServer/0",
          outFields: ["county", "state", "v002_rawvalue"],
          definitionExpression: "v002_rawvalue IS NULL OR v002_rawvalue = 0",
          renderer: noDataRenderer,
          title: "No Data",
          popupTemplate: {
            title: "{county}, {state}",
            content: "No mental health data available for this county."
          }
        });

        const layer = new FeatureLayer({
          url: "https://services.arcgis.com/V6ZHFr6zdgNZuVG0/ArcGIS/rest/services/County_Health_Rankings_2023_UC/FeatureServer/0",
          outFields: ["county", "state", "v002_rawvalue"],
          definitionExpression: "v002_rawvalue IS NOT NULL AND v002_rawvalue > 0",
          renderer: renderer,
          title: "Poor Mental Health Days by County",
          popupTemplate: {
            title: "{county}, {state}",
            content: ({ graphic }) => {
              const val = graphic.attributes.v002_rawvalue;
              if (val == null) return "No data available for this county.";
              const rounded = val.toFixed(1);
              let msg;
              if (val < 10) {
                msg = `<b>${rounded}%</b> of days were reported as poor mental health days — among the lowest in the country.`;
              } else if (val < 20) {
                msg = `<b>${rounded}%</b> of days were reported as poor mental health days — near the national average of 16%.`;
              } else {
                msg = `<b>${rounded}%</b> of days were reported as poor mental health days — above average, indicating elevated mental health burden.`;
              }
              return msg;
            }
          }
        });

        const map = new Map({ basemap: "gray-vector", layers: [noDataLayer, layer] });

        const view = new MapView({
          container: "viewDiv",
          map: map,
          center: [-96, 38],
          zoom: 4
        });

        view.ui.add(new Legend({ view }), "bottom-left");
      });
    </script>
  </head>
  <body>
    <div id="viewDiv"></div>
  </body>
</html>
