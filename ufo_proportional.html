<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    <title>UFO Sightings – Proportional Symbol Map</title>

    <link rel="stylesheet" href="https://js.arcgis.com/4.28/esri/themes/dark/main.css" />
    <script src="https://js.arcgis.com/4.28/"></script>

    <style>
      html, body, #viewDiv {
        padding: 0;
        margin: 0;
        height: 100%;
        width: 100%;
      }
    </style>

    <script>
      require(["esri/Map", "esri/views/MapView", "esri/layers/FeatureLayer", "esri/widgets/Legend"], (
        Map, MapView, FeatureLayer, Legend
      ) => {

        const renderer = {
          type: "simple",
          symbol: {
            type: "simple-marker",
            style: "circle",
            color: [0, 255, 180, 0.5],
            outline: { color: [0, 255, 180, 0.9], width: 0.5 }
          },
          visualVariables: [
            {
              type: "size",
              field: "duration__seconds_",
              legendOptions: { title: "Sighting Duration" },
              stops: [
                { value: 60,   size: 4,  label: "1 min"  },
                { value: 300,  size: 8,  label: "5 min"  },
                { value: 900,  size: 14, label: "15 min" },
                { value: 3600, size: 22, label: "1 hr+"  }
              ]
            },
            {
              type: "color",
              field: "duration__seconds_",
              stops: [
                { value: 60,   color: [180, 255, 220, 0.5] },
                { value: 900,  color: [0, 220, 150, 0.7]   },
                { value: 3600, color: [0, 140, 255, 0.85]  }
              ]
            }
          ]
        };

        const layer = new FeatureLayer({
          url: "https://services.arcgis.com/V6ZHFr6zdgNZuVG0/ArcGIS/rest/services/UFOSightings/FeatureServer/0",
          definitionExpression: "country = 'us' AND duration__seconds_ > 0",
          outFields: ["city", "state", "duration__seconds_", "duration__hours_min_", "datetime", "shape_1"],
          renderer: renderer,
          title: "UFO Sightings by Duration (USA)",
          popupTemplate: {
            title: "{city}, {state}",
            content: ({ graphic }) => {
              const a = graphic.attributes;
              const secs = a.duration__seconds_;
              const label = a.duration__hours_min_ || `${Math.round(secs)} seconds`;
              const shape = a.shape_1 || "unknown";
              const date = a.datetime ? new Date(a.datetime).toLocaleDateString() : "unknown date";

              let intensity;
              if (secs < 60) {
                intensity = `a brief <b>${Math.round(secs)}-second</b> sighting`;
              } else if (secs < 300) {
                intensity = `a short <b>${label}</b> sighting`;
              } else if (secs < 1800) {
                intensity = `a moderate <b>${label}</b> sighting`;
              } else if (secs < 7200) {
                intensity = `a prolonged <b>${label}</b> sighting`;
              } else {
                intensity = `an extraordinary <b>${label}</b> sighting`;
              }

              return `On ${date}, a <b>${shape}</b>-shaped UFO was reported over <b>${a.city}, ${a.state}</b> — ${intensity}.`;
            }
          }
        });

        const map = new Map({ basemap: "dark-gray-vector", layers: [layer] });

        const view = new MapView({
          container: "viewDiv",
          map: map,
          center: [-98, 38],
          zoom: 4
        });

        view.ui.add(new Legend({ view }), "bottom-left");
      });
    </script>
  </head>
  <body>
    <div id="viewDiv"></div>
  </body>
</html>
