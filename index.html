<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Andrew Martin</title>

  <style>
    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      color: #24292f;
      background-color: #ffffff;
    }

    /* Top banner */
    .top-banner {
      background-color: #f6f8fa;
      border-bottom: 1px solid #d0d7de;
      padding: 15px 0;
      text-align: center;
      font-weight: 500;
    }

    /* Main content */
    .container {
      max-width: 800px;
      margin: 60px auto;
      padding: 0 20px;
      line-height: 1.7;
    }

    h1 {
      font-size: 2.2rem;
      margin-bottom: 5px;
    }

    .subtitle {
      color: #57606a;
      margin-bottom: 30px;
    }

    hr {
      border: none;
      border-top: 1px solid #d0d7de;
      margin: 25px 0;
    }

    .intro {
      margin-bottom: 25px;
      font-size: 1.05rem;
    }

    /* Buttons */
    .nav-links a {
      display: inline-block;
      margin: 8px 10px 8px 0;
      padding: 8px 14px;
      border: 1px solid #d0d7de;
      border-radius: 6px;
      text-decoration: none;
      color: #0969da;
      background-color: #f6f8fa;
      transition: all 0.2s ease;
      font-size: 0.95rem;
      font-weight: 500;
    }

    .nav-links a:hover {
      background-color: #eaeef2;
      transform: translateY(-1px);
    }

    /* Bottom banner */
    .bottom-banner {
      background-color: #f6f8fa;
      border-top: 1px solid #d0d7de;
      padding: 15px 0;
      text-align: center;
      font-size: 0.9rem;
      color: #57606a;
      margin-top: 60px;
    }
  </style>
</head>

<body>

  <!-- Top gray banner -->
  <div class="top-banner">
    Andrew Martin | Portfolio
  </div>

  <div class="container">

    <h1>Welcome</h1>

    <div class="subtitle">Web Mapping & GIS</div>

    <hr>

    <p class="intro">
      Hi! I’m Andrew, and this is my GitHub site. Here you’ll find my projects,
      background, and ways to get in touch!
    </p>

    <div class="nav-links">
      <a href="about.html">About Me</a>
      <a href="projects.html">My Projects</a>
      <a href="contact.html">Contacts</a>
    </div>

  </div>

  <!-- Bottom gray banner -->
  <div class="bottom-banner">
    © 2026 Andrew Martin
  </div>

</body>
</html>
