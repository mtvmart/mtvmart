<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin-top: 40px;
        }

        .textbox {
            width: 60%;
            margin: 30px auto;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #ccc;
            font-size: 16px;
            background-color: white;
            resize: none;
        }

        .button-container {
            margin-top: 20px;
        }

        a {
            text-decoration: none;
        }

        button {
            display: block;
            width: 220px;
            margin: 15px auto;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Website</h1>

    <!-- Text Box -->
    <textarea class="textbox" rows="4" placeholder="Write something about yourself here..."></textarea>

    <!-- Buttons -->
    <div class="button-container">
        <a href="about.html">
            <button>About Me</button>
        </a>

        <a href="projects.html">
            <button>My Projects</button>
        </a>

        <a href="contact.html">
            <button>Contacts</button>
        </a>
    </div>

</body>
</html>
