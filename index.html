<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Andrew Martin</title>

    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            background: #eef2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            text-align: center;
            width: 400px;
        }

        h1 {
            margin-bottom: 20px;
        }

        .textbox {
            width: 100%;
            padding: 15px;
            border-radius: 10px;
            border: 1px solid #ddd;
            margin-bottom: 25px;
            font-size: 14px;
            resize: none;
            background: #fafafa;
        }

        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            margin: 10px 0;
            border: none;
            border-radius: 12px;
            background: #2c3e50;
            color: white;
            font-size: 16px;
            cursor: pointer;
            transition: 0.3s;
        }

        .btn:hover {
            background: #1a252f;
            transform: translateY(-2px);
        }

        a {
            text-decoration: none;
        }
    </style>
</head>

<body>

    <div class="container">
        <h1>Welcome</h1>

        <!-- Text Box -->
        <textarea class="textbox" rows="4" placeholder="Write something about yourself here..."></textarea>

        <!-- Buttons -->
        <a href="about.html"><button class="btn">About Me</button></a>
        <a href="projects.html"><button class="btn">My Projects</button></a>
        <a href="contact.html"><button class="btn">Contacts</button></a>
    </div>

</body>
</html>
