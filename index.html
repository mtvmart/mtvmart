<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: #f5f5f5;
            margin: 0;
            padding: 0;
        }

        h1 {
            margin-top: 50px;
        }

        .button-container {
            margin-top: 40px;
        }

        a {
            text-decoration: none;
        }

        button {
            display: block;
            width: 200px;
            margin: 15px auto;
            padding: 15px;
            font-size: 16px;
            border: none;
            border-radius: 10px;
            background-color: #007BFF;
            color: white;
            cursor: pointer;
            transition: 0.3s;
        }

        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>

<body>

    <h1>Welcome to My Website</h1>

    <div class="button-container">
        <a href="page1.html">
            <button>Page 1</button>
        </a>

        <a href="page2.html">
            <button>Page 2</button>
        </a>

        <a href="page3.html">
            <button>Page 3</button>
        </a>
    </div>

</body>
</html>
