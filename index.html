<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Website</title>
  <style>
    body {
      font-family: Arial, Helvetica, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 0 20px;
      line-height: 1.6;
      color: #222;
      background: #fff;
    }

    h1, h2 {
      font-weight: bold;
      margin-bottom: 10px;
    }

    .subtitle {
      font-size: 1.1rem;
      margin-bottom: 30px;
    }

    .textbox {
      width: 100%;
      min-height: 120px;
      padding: 12px;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 4px;
      box-sizing: border-box;
      margin-bottom: 25px;
      resize: vertical;
    }

    .nav-links {
      margin-top: 10px;
      margin-bottom: 30px;
    }

    .nav-links a {
      display: block;
      margin: 8px 0;
      color: #0366d6;
      text-decoration: none;
      font-size: 1rem;
    }

    .nav-links a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <h1>My GitHub Website</h1>
  <div class="subtitle">Portfolio and projects of Andrew Martin</div>

  <h1>Welcome</h1>

  <textarea class="textbox" placeholder="Write something here..."></textarea>

  <p>
    Hi! I’m Andrew Martin, and this is my personal website.
  </p>

  <p>
    Use the links below to explore:
  </p>

  <div class="nav-links">
    <a href="about.html">About Me</a>
